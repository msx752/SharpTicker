name: Documentation
description: Report missing, unclear or wrong documentation or samples
title: "[Docs]: "
labels: ["type:docs"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the page, README section or sample project.
      placeholder: "e.g. https://github.com/msx752/SharpTicker/wiki/..."
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Missing information
        - Wrong or outdated information
        - Unclear explanation
        - Broken link or sample
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing, and what would have helped you?
    validations:
      required: true
