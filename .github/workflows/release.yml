name: Release

# Publishes the packages to NuGet when a GitHub release is published.
# The release tag is "v" plus the package version, e.g. "v1.2.3" or "v1.2.3-rc.1". The tag must be on main,
# and the release is marked as a pre-release exactly when the version has a "-" suffix.
# See "Releasing" in CONTRIBUTING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Runs without secrets or approval, so an invalid release never reaches the nuget environment.
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag, prerelease flag and branch
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"

          # Semantic Versioning 2.0.0 without build metadata ("+..."), which NuGet does not keep
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          # The "v" prefix is required: the nuget environment only deploys from tags matching v*
          if [[ "$TAG" != v* ]] || ! [[ "$version" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a version such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          # A version with a "-" suffix is a prerelease on NuGet; the GitHub release must say the same
          if [[ "$version" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "::error::$version is a prerelease version; mark the GitHub release as a pre-release."
            exit 1
          fi
          if [[ "$version" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "::error::$version is a stable version; the GitHub release must not be marked as a pre-release."
            exit 1
          fi

          # Only commits that are on main are released
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to a commit that is not on main."
            exit 1
          fi

          # NuGet versions are permanent; fail instead of silently skipping an existing one
          status=$(curl -s -o versions.json -w '%{http_code}' https://api.nuget.org/v3-flatcontainer/sharpticker/index.json)
          if [[ "$status" == "200" ]] && jq -e --arg v "${version,,}" '.versions | index($v)' versions.json > /dev/null; then
            echo "::error::SharpTicker $version is already on NuGet."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, test and publish
    needs: validate
    runs-on: ubuntu-latest
    # Holds the NUGET_API_KEY secret; its required reviewer approves each publish
    environment: nuget
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK version comes from global.json; one SDK builds all target frameworks.
      # The 8.0 and 9.0 runtimes are needed because the tests run on every target before publishing.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/SharpTicker.Dashboard/wwwroot/package-lock.json

      - name: Build dashboard UI
        working-directory: src/SharpTicker.Dashboard/wwwroot
        run: |
          npm ci
          npm run build

      - name: Build
        run: dotnet build SharpTicker.slnx --configuration Release -p:Version="$PACKAGE_VERSION"

      - name: Test
        run: dotnet test SharpTicker.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack SharpTicker.slnx --configuration Release --no-build -p:Version="$PACKAGE_VERSION" --output nupkgs

      # Pushing the .nupkg files also pushes the matching .snupkg symbol packages.
      # --skip-duplicate only matters when re-running this job after a partial push; a new release
      # of an existing version is already rejected by the validate job.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
